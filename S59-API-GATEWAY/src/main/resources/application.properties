# =========================================================
# API GATEWAY CONFIGURATION
# =========================================================
spring.application.name=S59-API-GATEWAY
server.port=8000

# =========================================================
# EUREKA CLIENT CONFIGURATION
# =========================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================================================
# ROUTE 1: MS1
# =========================================================
spring.cloud.gateway.server.webflux.routes[0].id=MS1
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MS1
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/ms1/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=ms1CB
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/ms1

# =========================================================
# ROUTE 2: MS2
# =========================================================
spring.cloud.gateway.server.webflux.routes[1].id=MS2
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MS2
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/ms2/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=ms2CB
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/ms2

# =========================================================
# ROUTE 3: PRODUCT SERVICE
# =========================================================
spring.cloud.gateway.server.webflux.routes[2].id=PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SOA-SKILL-PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/products/**

# =========================================================
# ROUTE 4: CART SERVICE
# =========================================================
spring.cloud.gateway.server.webflux.routes[3].id=CART-SERVICE
spring.cloud.gateway.server.webflux.routes[3].uri=lb://SOA-SKILL-CART-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/cart/**

# =========================================================
# ROUTE 5: AUTH SERVICE
# =========================================================
spring.cloud.gateway.server.webflux.routes[4].id=AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[4].uri=lb://SOA-PROJECT
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/auth/**

# =========================================================
# ROUTE 6: PROPERTY SERVICE
# =========================================================
spring.cloud.gateway.server.webflux.routes[5].id=PROPERTY-SERVICE
spring.cloud.gateway.server.webflux.routes[5].uri=lb://SOA-PROJECT-PROPERTY-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/properties/**

# =========================================================
# ROUTE 7: INVENTORY SERVICE
# =========================================================
spring.cloud.gateway.server.webflux.routes[6].id=inventory-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://SOA-Exam-Inventoryservice
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/inventory/**

# =========================================================
# ROUTE 8: SHIPPING SERVICE
# =========================================================
spring.cloud.gateway.server.webflux.routes[7].id=shipping-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://SOA-Exam-Shippingservice
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/shipping/**

# =========================================================
# ROUTE 9: INQUIRY SERVICE
# =========================================================
spring.cloud.gateway.server.webflux.routes[8].id=INQUIRY-SERVICE
spring.cloud.gateway.server.webflux.routes[8].uri=lb://SOA-PROJECT-INQUIRY-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/inquiries/**

# =========================================================
# ROUTE 10: VISIT SERVICE
# =========================================================
spring.cloud.gateway.server.webflux.routes[9].id=VISIT-SERVICE
spring.cloud.gateway.server.webflux.routes[9].uri=lb://SOA-PROJECT-VISIT-SERVICE
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/visits/**

# =========================================================
# ROUTE 11: BOOKING SERVICE
# =========================================================
spring.cloud.gateway.server.webflux.routes[10].id=BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[10].uri=lb://SOA-PROJECT-BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/bookings/**

# =========================================================
# AUTH SWAGGER DOCUMENTATION ROUTE
# =========================================================
spring.cloud.gateway.server.webflux.routes[11].id=AUTH-SWAGGER-DOCS
spring.cloud.gateway.server.webflux.routes[11].uri=lb://SOA-PROJECT
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.server.webflux.routes[11].order=-1

# Rewrite Auth documentation path
spring.cloud.gateway.server.webflux.routes[11].filters[0].name=RewritePath
spring.cloud.gateway.server.webflux.routes[11].filters[0].args.regexp=/auth/v3/api-docs
spring.cloud.gateway.server.webflux.routes[11].filters[0].args.replacement=/v3/api-docs

# Forward Gateway host information to Auth
spring.cloud.gateway.server.webflux.routes[11].filters[1].name=AddRequestHeader
spring.cloud.gateway.server.webflux.routes[11].filters[1].args.name=X-Forwarded-Host
spring.cloud.gateway.server.webflux.routes[11].filters[1].args.value=localhost:8000

spring.cloud.gateway.server.webflux.routes[11].filters[2].name=AddRequestHeader
spring.cloud.gateway.server.webflux.routes[11].filters[2].args.name=X-Forwarded-Proto
spring.cloud.gateway.server.webflux.routes[11].filters[2].args.value=http

# =========================================================
# RESILIENCE4J CONFIGURATION
# =========================================================
resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.circuitbreaker.configs.default.sliding-window-size=10

# =========================================================
# GATEWAY ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

# =========================================================
# SWAGGER UI CONFIGURATION
# =========================================================
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs
springdoc.swagger-ui.urlsPrimaryName=Auth Service

